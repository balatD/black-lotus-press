name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:app

      - name: Build the command-line tool
        run: npm run build

      - name: Unit tests
        run: npm test

      # Ubuntu's AppArmor keeps Chromium's sandbox from starting outside /opt.
      - name: Allow Electron's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: End-to-end tests on a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
