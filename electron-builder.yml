appId: io.github.balatd.black-lotus-press
productName: Black Lotus Press
# Without the version, so "releases/latest/download/<name>" always points at the newest build.
artifactName: Black-Lotus-Press-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
  # Node loads pdf-lib and its helpers from their CommonJS builds, the browser and ES builds are dead weight.
  - "!**/node_modules/{pdf-lib,@pdf-lib/*}/{dist,es,src,ts3.4}/**"
  - "!**/node_modules/pdf-lib/**/*.{map,d.ts}"
  # playwright itself only re-exports playwright-core, its lib/ is the test runner.
  - "!**/node_modules/playwright/lib/**"
# Chromium's own strings (context menus, dialogs). Other system languages fall back to English.
electronLanguages: [en-US, de]
asarUnpack:
  # Native libvips binaries and the Playwright driver cannot run from inside the asar archive.
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
  - "**/node_modules/playwright-core/**/*"
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  extraResources:
    - from: build/native
      to: native
  # Ad-hoc signature: Apple Silicon refuses to start unsigned apps at all.
  identity: "-"
  hardenedRuntime: false
dmg:
  format: UDBZ
win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
nsis:
  artifactName: Black-Lotus-Press-${os}-${arch}-setup.${ext}
linux:
  target:
    - target: AppImage
      arch: x64
  category: Graphics
